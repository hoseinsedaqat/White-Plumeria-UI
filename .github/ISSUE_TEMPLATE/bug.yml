name: Bug
description: A defect in a shipped component or package
labels: [bug]
body:
  - type: textarea
    attributes:
      label: What happened
    validations:
      required: true
  - type: input
    attributes:
      label: Package and version
      placeholder: "@white-plumeria/react 0.1.0"
  - type: textarea
    attributes:
      label: Steps
    validations:
      required: true
