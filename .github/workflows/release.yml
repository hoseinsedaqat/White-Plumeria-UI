name: Release

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type pack to run a dry-run pack. This workflow does not publish.
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  pack:
    if: github.event.inputs.confirm == 'pack'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "./packages/*" build
      - name: Dry-run pack
        run: pnpm pack:dry-run
      - name: Report size
        run: pnpm size
      - name: Publish gate
        run: echo "Trusted publishing is not configured and no package was uploaded."
