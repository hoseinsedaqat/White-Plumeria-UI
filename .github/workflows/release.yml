name: Release

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type pack to run a dry-run pack. This workflow does not publish.
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  pack:
    if: github.event.inputs.confirm == 'pack'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @white-plumeria/tokens --filter @white-plumeria/core --filter @white-plumeria/styles --filter @white-plumeria/react --filter @white-plumeria/vue --filter @white-plumeria/angular --filter @white-plumeria/ai --filter @white-plumeria/elements --filter @white-plumeria/cli --filter @white-plumeria/mcp build
      - run: pnpm --filter @white-plumeria/svelte build
      - name: Dry-run pack
        run: |
          for dir in packages/*; do
            echo "::group::$dir"
            npm pack --dry-run --json --pack-destination /tmp > /dev/null
            (cd "$dir" && npm pack --dry-run)
            echo "::endgroup::"
          done
      - name: Publish gate
        run: echo "Trusted publishing is not configured and no package was uploaded."
