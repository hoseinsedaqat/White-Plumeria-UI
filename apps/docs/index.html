<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>White Plumeria</title>
    <meta
      name="description"
      content="White Plumeria is a framework-agnostic design system for HTML, React, Vue, Svelte, Angular, Solid, Preact, Qwik, Lit, Alpine, Marko, and Ember. No Tailwind required."
    />
    <meta name="theme-color" content="#F6F1E8" />
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%BASE_URL%brand/logo.jpg" />
    <meta property="og:title" content="White Plumeria" />
    <meta
      property="og:description"
      content="A design system for HTML, React, Vue, Svelte, Angular, Solid, Preact, Qwik, Lit, Alpine, Marko, and Ember. Own tokens and CSS. Tailwind is not required."
    />
    <meta property="og:image" content="%BASE_URL%brand/social.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="White Plumeria" />
    <meta
      name="twitter:description"
      content="A design system for HTML, React, Vue, Svelte, Angular, Solid, Preact, Qwik, Lit, Alpine, Marko, and Ember. Own tokens and CSS. Tailwind is not required."
    />
    <meta name="twitter:image" content="%BASE_URL%brand/social.jpg" />
    <script>
      (function () {
        try {
          var raw = localStorage.getItem("wpl.preferences");
          var prefs = raw ? JSON.parse(raw) : {};
          var theme = prefs.theme || "white";
          var appearance = prefs.appearance || "system";
          var root = document.documentElement;
          root.setAttribute("data-wpl-theme", theme);
          root.setAttribute("data-wpl-appearance", appearance);
          if (appearance === "system") root.removeAttribute("data-wpl-scheme");
          else root.setAttribute("data-wpl-scheme", appearance);
          root.lang = "en";
          root.dir = "ltr";
        } catch (error) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
